# Aplica los SQL de supabase/preview a la base de datos de la PREVIEW (Supabase)
# en cada push a main que los cambie. Solo la preview: nunca producción.
# Requiere el secreto PREVIEW_DATABASE_URL (Session pooler de Supabase).
name: Base de datos de la preview

on:
  push:
    branches: [main]
    paths:
      - "supabase/preview/**"
      - "scripts/preview/**"
      - ".github/workflows/preview-db.yml"
  workflow_dispatch:

concurrency:
  group: preview-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts pg@8
      - name: Aplicar SQL pendientes
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          PREVIEW_DATABASE_CA: ${{ secrets.PREVIEW_DATABASE_CA }}
        run: node scripts/preview/apply-sql.mjs
